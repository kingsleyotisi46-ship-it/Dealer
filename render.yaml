services:
  - type: web
    name: coach-jv-tech
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations core && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      # Render prompts you to enter your Neon PostgreSQL connection string during Blueprint setup.
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
